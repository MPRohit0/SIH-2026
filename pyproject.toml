[project]
name = "sih26161"
version = "1.0.0"
description = "Multi-fidelity Flood & Dam-Breach Inundation Simulation Framework"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # Dashboard & UI
    "streamlit>=1.36.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.20.0",
    "branca>=0.7.0",

    # Contracts & Schema
    "jsonschema>=4.22.0",
    "fastjsonschema>=2.19.0",

    # Scientific & Geospatial
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "shapely>=2.0.0",

    # Data Modeling & HTTP
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["modules/m8_dashboard/tests", "tests"]
